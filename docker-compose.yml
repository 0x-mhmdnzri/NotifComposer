version: '3.8'

# Postgres ports are NOT published to the host (only on app-network).
# gRPC is internal-only (no host mapping for 8081).
# Set strong values via environment / .env before any non-local use.

services:
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!}
      POSTGRES_DB: identitydb
    volumes:
      - identity_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-appuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  employee-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!}
      POSTGRES_DB: employeedb
    volumes:
      - employee_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-appuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!}
      POSTGRES_DB: notificationdb
    volumes:
      - notification_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-appuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    # Kafka not published to host by default (internal only)
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  identity-service:
    build:
      context: ./src/IdentityService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=identity-db;Port=5432;Database=identitydb;Username=${POSTGRES_USER:-appuser};Password=${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=50;Timeout=5;Command Timeout=5
      Security__ApiKeys: ${API_KEY:-dev-api-key-change-me-in-production}
      Security__AllowedOrigins: ${ALLOWED_ORIGINS:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "5001:8080"
      # gRPC intentionally NOT published to host — only reachable as identity-service:8081 on app-network
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - app-network

  employee-service:
    build:
      context: ./src/EmployeeService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=employee-db;Port=5432;Database=employeedb;Username=${POSTGRES_USER:-appuser};Password=${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=50;Timeout=5;Command Timeout=5
      IdentityService__GrpcAddress: http://identity-service:8081
      IdentityService__TimeoutMilliseconds: "150"
      Kafka__BootstrapServers: kafka:9092
      Security__ApiKeys: ${API_KEY:-dev-api-key-change-me-in-production}
      Security__AllowedOrigins: ${ALLOWED_ORIGINS:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "5003:8080"
    depends_on:
      employee-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app-network

  notification-service:
    build:
      context: ./src/NotificationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=notification-db;Port=5432;Database=notificationdb;Username=${POSTGRES_USER:-appuser};Password=${POSTGRES_PASSWORD:-ChangeMe_UseStrongPassword_9fK2!};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=50;Timeout=5;Command Timeout=5
      Kafka__BootstrapServers: kafka:9092
      Security__ApiKeys: ${API_KEY:-dev-api-key-change-me-in-production}
      Security__AllowedOrigins: ${ALLOWED_ORIGINS:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "5005:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network

volumes:
  identity_data:
  employee_data:
  notification_data:

networks:
  app-network:
    driver: bridge
